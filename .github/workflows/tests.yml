name: tests

# Шаг A0 плана миграции: прогон вне машины разработчика.
# docs/architecture/04-migration-plan.md
#
# План состоит из двух десятков шагов, каждый из которых обязан оставлять
# систему рабочей. Без автоматического прогона это надежда на дисциплину.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Остальное берётся из значений по умолчанию config/settings.py:
      # DEBUG=1, dev-ключ, ALLOWED_HOSTS=localhost. Ставить DEBUG=0 нельзя —
      # тогда сработает предохранитель, требующий настоящий SECRET_KEY.
      DB_ENGINE: sqlite
      SQLITE_PATH: /tmp/ci-db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установить зависимости
        run: uv sync --group dev

      # Причина падения выносится в аннотацию намеренно: логи прогона и сводка
      # задания закрыты для всех, кроме администратора репозитория, а аннотации
      # отдаются публичным API. Прогон, причину падения которого нельзя
      # прочитать, страховочной сеткой не является.
      - name: Тесты
        shell: bash
        run: |
          set +e
          uv run pytest -q > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          [ $status -ne 0 ] && .github/annotate.sh pytest /tmp/pytest.log
          exit $status

      - name: Контракты границ модулей
        shell: bash
        run: |
          set +e
          uv run lint-imports > /tmp/lint.log 2>&1
          status=$?
          cat /tmp/lint.log
          [ $status -ne 0 ] && .github/annotate.sh lint-imports /tmp/lint.log
          exit $status
