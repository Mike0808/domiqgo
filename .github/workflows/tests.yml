name: tests

# Шаг A0 плана миграции: прогон вне машины разработчика.
# docs/architecture/04-migration-plan.md
#
# План состоит из двух десятков шагов, каждый из которых обязан оставлять
# систему рабочей. Без автоматического прогона это надежда на дисциплину.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Остальное берётся из значений по умолчанию config/settings.py:
      # DEBUG=1, dev-ключ, ALLOWED_HOSTS=localhost. Ставить DEBUG=0 нельзя —
      # тогда сработает предохранитель, требующий настоящий SECRET_KEY.
      DB_ENGINE: sqlite
      SQLITE_PATH: /tmp/ci-db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установить зависимости
        run: uv sync --group dev

      # Вывод инструментов дублируется в сводку задания намеренно: логи прогона
      # закрыты для всех, кроме администратора репозитория, а сводка доступна
      # через публичный API. Прогон, причину падения которого нельзя прочитать,
      # страховочной сеткой не является.
      - name: Тесты
        shell: bash
        run: |
          set +e
          uv run pytest -q > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          if [ $status -ne 0 ]; then
            { echo '## pytest'; echo; echo '```'; tail -n 60 /tmp/pytest.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Контракты границ модулей
        shell: bash
        run: |
          set +e
          uv run lint-imports > /tmp/lint.log 2>&1
          status=$?
          cat /tmp/lint.log
          { echo '## lint-imports'; echo; echo '```'; cat /tmp/lint.log; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit $status
